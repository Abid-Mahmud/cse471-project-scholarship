{% extends "base.html" %}
{% block title %}Verify OTP - ScholarMatch{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center animated-bg relative overflow-hidden px-4">
    <div class="relative w-full max-w-md animate-fade-in">
        <div class="glass-card rounded-2xl shadow-2xl p-8 relative overflow-hidden border border-red-500/20 text-center">
            <h1 class="text-2xl font-bold text-white tracking-tight mb-2">Two-Step Verification</h1>
            <p class="text-indigo-100 text-sm mb-6">Enter the 6-digit verification code sent to your registered admin email.</p>
            <form method="POST" class="space-y-5">
                <div>
                    <input type="text" name="otp" required maxlength="6" class="block w-full text-center tracking-widest text-2xl px-3 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-indigo-200/60 focus:outline-none focus:ring-2 focus:ring-red-400" placeholder="123456">
                </div>
                <button type="submit" class="w-full py-2.5 px-4 bg-white text-red-600 font-semibold rounded-xl shadow-lg hover:bg-red-50 transition-all duration-300">
                    Verify & Authenticate
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
