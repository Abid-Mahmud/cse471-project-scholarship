{% extends "base.html" %}
{% block title %}Verify Identity - ScholarMatch{% endblock %}

{% block content %}
<div class="min-h-screen animated-bg flex items-center justify-center p-6 text-white relative overflow-hidden">
    
    <!-- Glassmorphism Card -->
    <div class="glass-card max-w-md w-full p-8 rounded-3xl shadow-2xl z-10 relative">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-white/20">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold mb-2 tracking-tight">2-Step Verification</h1>
            <p class="text-white/80 text-sm">We've sent a 6-digit verification code to your email. Enter it below to securely log in.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.verify_otp') }}" class="space-y-6">
            <div>
                <label class="block text-xs font-semibold text-white/80 uppercase tracking-wider mb-2">Verification Code</label>
                <input type="text" name="otp" required maxlength="6" pattern="\d{6}" placeholder="• • • • • •"
                    class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-4 text-center text-2xl tracking-[0.5em] text-white placeholder-white/40 focus:outline-none focus:border-white focus:ring-2 focus:ring-white/50 transition-all font-mono">
            </div>

            <button type="submit" class="w-full py-3.5 bg-white text-indigo-600 font-bold rounded-xl hover:bg-gray-100 transition-all shadow-lg flex items-center justify-center gap-2">
                Verify & Login
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <a href="{{ url_for('auth.login') }}" class="text-sm text-white/80 hover:text-white font-medium transition-colors">← Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
