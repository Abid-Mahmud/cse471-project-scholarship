{% extends "base.html" %}
{% block title %}Admin Portal - ScholarMatch{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center animated-bg relative overflow-hidden px-4">
    <div class="relative w-full max-w-md animate-fade-in">
        <div class="glass-card rounded-2xl shadow-2xl p-8 relative overflow-hidden border border-red-500/20">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-red-500/20 mb-4 shadow-inner text-red-400">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 class="text-3xl font-bold text-white tracking-tight">Admin Portal</h1>
                <p class="text-red-200 mt-2 text-sm">Restricted Access • System Management</p>
            </div>
            <form method="POST" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-white/90 mb-1">Admin Email</label>
                    <input type="email" name="email" required class="block w-full px-3 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-indigo-200/60 focus:outline-none focus:ring-2 focus:ring-red-400" placeholder="admin@scholarmatch.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-white/90 mb-1">Secure Password</label>
                    <input type="password" name="password" required class="block w-full px-3 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-indigo-200/60 focus:outline-none focus:ring-2 focus:ring-red-400" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full py-2.5 px-4 bg-red-600 text-white font-semibold rounded-xl shadow-lg hover:bg-red-500 transition-all duration-300">
                    Proceed to Verification 
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
